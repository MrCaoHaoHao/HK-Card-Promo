name: hk-card-promo-monitor

on:
  schedule:
    # ============ 北京时间(UTC+8) → UTC 换算：UTC = 北京 - 8 ============
    # 每月 1-5 号（新活动高发期）：北京 8:00-20:00 每 10 分钟
    - cron: "*/10 0-11 1-5 * *"        # 北京 8:00-19:50
    # 每月 6-月底：北京 8:00-20:00 每 30 分钟
    - cron: "*/30 0-11 6-31 * *"       # 北京 8:00-19:30
    - cron: "0 12 * * *"               # 每天北京 20:00 整（收尾一轮）
    # 1-5 号凌晨 0:00-2:00 每 10 分钟（=UTC 前一天 16-18 点；
    # 1 号凌晨对应上月 28-31 号，故用 1-4,28-31 覆盖，
    # 副作用：29-31 号凌晨也会 10 分钟一轮，成本可忽略）
    - cron: "*/10 16-17 1-4,28-31 * *" # 北京 0:00-1:50
    - cron: "0 18 1-4,28-31 * *"       # 北京 2:00 整
  workflow_dispatch: {}   # 支持在 GitHub 页面手动触发

# 同一时刻只保留一轮运行，避免两轮并发互相覆盖数据提交
concurrency:
  group: promo-scan
  cancel-in-progress: false

permissions:
  contents: write   # 允许把增量数据提交回仓库持久化

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r hk_card_promo/requirements.txt

      - name: Run scraper
        env:
          HKP_SCKEY: ${{ secrets.HKP_SCKEY }}
        run: python hk_card_promo/main.py

      - name: Persist data (commit only when incremental change exists)
        run: |
          changed=$(python - <<'EOF'
          import json
          s = json.load(open("hk_card_promo/data/_run_summary.json"))
          print("yes" if (s.get("new") or s.get("offline")) else "no")
          EOF
          )
          if [ "$changed" = "yes" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add hk_card_promo/data
            git commit -m "chore(data): incremental update $(date -u +%F\ %R) UTC"
            git push
            echo "data committed"
          else
            echo "no incremental change, skip commit"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: promo-report-${{ github.run_number }}
          path: hk_card_promo/data/report_latest.md
          retention-days: 7
